[project]
name = "llm-annotator"
version = "0.1.0"
description = "A Python package for LLM-powered text annotation and classification with CSV support"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.63.2",
    "pandas>=2.2.3",
    "pytest-mock>=3.12.0",
    "pytest>=8.3.4",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
